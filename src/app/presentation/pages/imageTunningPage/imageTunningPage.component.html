@if ( originalImage()) {
    <div class="fixed flex flex-col items-center top-10 right-10 z-10 fade-in">
        <span>Editando</span>
        <img [src]="originalImage()" 
            alt="Imagen original y a editar"
            class="border rounded-xl w-36 h-36 object-contain"
        />

        <button
            (click)="generatedVariation()"
            class="btn-primary mt-2">
            Generar variación
        </button>
    </div>
}


<div class="chat-container">
    <div class="chat-messages">

        <div class="grid gap-y-2">
            <!-- Chat Messages -->
            <app-gpt-message
                text="Describe en texto la imagen que deseas que se genere"
            />

            @for (message of messages(); track $index) {
                @if ( message.isGpt ) {
                    <app-gpt-message-editable-image
                        [text]="message.text"
                        [imageInfo]="message.imageInfo!"
                        (onSelectedImage)="handleImageChange($event, message.imageInfo!.url)"
                    />
                } @else {
                    <app-my-meesage [text]="message.text" />
                }
            }

            @if(isLoading()){
                <app-typing-loader />
            }
        </div>
    </div>
    <!-- MessagesBox -->
    <!-- Este solo muestra la caja de texto sin posibilidad de cargar archivos-->
   <app-text-message-box 
        placeholder="Escribe lo que quieras"
        (onMessage)="handleMessage($event)"
    />
</div>
