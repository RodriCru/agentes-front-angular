<div class="chat-container">
    <div class="chat-messages">

        <div class="grid gap-y-2">
            <!-- Chat Messages -->
            <app-gpt-message
                text="Hola, dime, ¿Qué deseas comparar en stream?"
            />

            @for (message of messages(); track message.text) {
                @if ( message.isGpt ) {
                    <app-gpt-message [text]="message.text" />
                } @else {
                    <app-my-meesage [text]="message.text" />
                }
            }

            @if(isLoading()){
                <app-typing-loader />
            }
        </div>
    </div>
    
   <app-text-message-box 
        placeholder="Escribe lo que quieras"
        (onMessage)="handleMessage($event)"
    />

</div>
