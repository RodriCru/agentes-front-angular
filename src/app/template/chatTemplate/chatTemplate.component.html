<div class="chat-container">
    <div class="chat-messages">

        <div class="grid gap-y-2">
            <!-- Chat Messages -->
            <app-gpt-message
                text="Escribe el texto que quieras que revise"
            />

            @for (message of messages(); track $index) {
                @if ( message.isGpt ) {
                    <app-gpt-message [text]="message.text" />
                } @else {
                    <app-my-meesage [text]="message.text" />
                }
            }

            @if(isLoading()){
                <app-typing-loader />
            }
        </div>
    </div>
    <!-- MessagesBox -->
    <!-- Este solo muestra la caja de texto sin posibilidad de cargar archivos-->
   <app-text-message-box 
        placeholder="Escribe lo que quieras"
        (onMessage)="handleMessage($event)"
    />

    <!-- Este código muestra la caja de texto con posibilidad de cargar archivos-->
    <!-- <app-text-message-box-file 
        placeholder="Escribe lo que quieras"
        (onMessage)="handleMessageWithFile($event)"
    /> -->

    <!-- Este código muestra la caja de texto con posibilidad de seleccinar-->
    <!-- <app-text-message-box-select 
        placeholder="Escribe lo que quieras"
        [options]="[{ id:'1', text:'1'},{ id:'2', text:'2'}, { id:'3', text:'3'},]"
        (onMessage)="handleMessageWithSelect($event)"
    />-->
</div>
